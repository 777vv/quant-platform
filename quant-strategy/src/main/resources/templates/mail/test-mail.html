<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>测试邮件</title>
</head>
<body style="margin:0;padding:24px;background:#f5f7fa;font-family:'Microsoft YaHei',Arial,sans-serif;color:#303133;">
  <div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;overflow:hidden;border:1px solid #ebeef5;">
    <div style="padding:20px 24px;background:#1f2d3d;color:#ffffff;">
      <div style="font-size:18px;font-weight:bold;">量化投资平台 · 测试邮件</div>
    </div>
    <div style="padding:20px 24px;">
      <p style="font-size:14px;line-height:1.8;margin:0;">
        这是一封测试邮件，收到即说明邮件通知链路（SMTP 配置 / 授权码 / 收件人）工作正常。
      </p>
      <p style="font-size:13px;color:#909399;margin:12px 0 0;">
        收件人：<span th:text="${to}">someone@example.com</span><br/>
        发送时间：<span th:text="${time}">2026-09-15 21:00</span>
      </p>
    </div>
  </div>
</body>
</html>
