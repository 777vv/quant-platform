# 开发环境：连接本机 MySQL/Redis（本地库需 utf8mb4）
spring:
  datasource:
    # createDatabaseIfNotExist：本地首次启动自动建 quant 库
    url: jdbc:mysql://localhost:3306/quant?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    # 业务包 INFO（V6.43 用户要求：dev 也不再刷 MyBatis SQL 参数/框架 DEBUG——此前 root=DEBUG + com.quant=debug
    # 会把每条 insert 的 SQL 参数、Spring MVC 调试全量打进控制台）。要看东财请求诊断走 logs/eastmoney.log
    #（logback 的专用通道，dev/prod 一致）；临时要业务 DEBUG 时改回 com.quant: debug 即可。
    com.quant: info
