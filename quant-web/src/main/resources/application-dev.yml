# 开发环境：连接本机 MySQL/Redis（本地库需 utf8mb4）
spring:
  datasource:
    # createDatabaseIfNotExist：本地首次启动自动建 quant 库
    url: jdbc:mysql://localhost:3306/quant?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    # 开发期业务包 DEBUG（含东财 client 请求日志）
    com.quant: debug
